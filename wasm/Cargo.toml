[package]
name = "pgtk-playground-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pgtk-sql = { version = "=0.1.0", default-features = false, features = ["pg18", "spans", "arbitrary"] }
pgtk-analyze = { version = "=0.1.0", default-features = false, features = ["pg18"] }
pgtk-catalog = { version = "=0.1.0" }
recursa = "=0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 16
panic = "abort"
strip = true

# wasm-opt makes the brotli size only 1% smaller and takes many minutes.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Until the next releases of pgtk and recursa: pgtk-sql's pretty-print layout (one clause on each
# line) needs the layout settings of recursa at this commit, and the pgtk-catalog Loader at this
# commit reads no clock, so it runs in the browser. The recursa patch must name the commit that
# the pgtk commit patches recursa to.
[patch.crates-io]
pgtk-sql = { git = "https://github.com/freshtonic/pgtk", rev = "b063917c750c0307ae2e8d5b839f37037cfd9752" }
pgtk-analyze = { git = "https://github.com/freshtonic/pgtk", rev = "b063917c750c0307ae2e8d5b839f37037cfd9752" }
pgtk-catalog = { git = "https://github.com/freshtonic/pgtk", rev = "b063917c750c0307ae2e8d5b839f37037cfd9752" }
recursa = { git = "https://github.com/freshtonic/recursa", rev = "42a1152704d1a031d98011d201d4a2cbe5e6980a" }
recursa-core = { git = "https://github.com/freshtonic/recursa", rev = "42a1152704d1a031d98011d201d4a2cbe5e6980a" }
recursa-codegen = { git = "https://github.com/freshtonic/recursa", rev = "42a1152704d1a031d98011d201d4a2cbe5e6980a" }
recursa-macros = { git = "https://github.com/freshtonic/recursa", rev = "42a1152704d1a031d98011d201d4a2cbe5e6980a" }
recursa-diagrams = { git = "https://github.com/freshtonic/recursa", rev = "42a1152704d1a031d98011d201d4a2cbe5e6980a" }
